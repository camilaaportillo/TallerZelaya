<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="imgs/favicon.png" type="image/png">
    <title>Ventas</title>
    <link rel="stylesheet" href="css/ventaStyle.css">
    <!-- Choices (CSS y JS) - CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>
    <style>
        body {
            visibility: hidden;
        }

        /* oculta el body si no se ha iniciado sesion */
        
        .tipo-articulo {
            display: flex;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            overflow: hidden;
        }
        
        .tipo-articulo-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: #f5f5f5;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .tipo-articulo-btn.active {
            background: #007bff;
            color: white;
        }
        
        .campo-dinamico {
            transition: all 0.3s;
        }
        
        .campo-oculto {
            display: none !important;
        }
    </style>
    <script src="js/sesion.js"></script>

</head>

<body>

    <!-- Encabezado -->
    <header>
        <button class="logo-btn" onclick="irInicio()">
            <img src="imgs/bicicleta.png" alt="Logo bicicleta">
            <span class="hover-text">Inicio</span>
        </button>
        <h1>Taller de bicicletas Zelaya</h1>
        <div class="usuario">
            <div class="info-usuario">
                <span id="nombreUsuario" class="nombre-usuario">Usuario</span>
                <span id="rolUsuario" class="rol-usuario"></span>
            </div>
            <button class="user-btn" onclick="toggleMenu()">
                <img src="imgs/logo_user.png" alt="Usuario">
            </button>
            <div id="menuUsuario" class="menu-usuario">
                <a href="#" onclick="cerrarSesion()">Cerrar sesión</a>
            </div>
        </div>
    </header>

    <main>

        <!-- Formulario Único -->
        <section class="formulario">
            <!-- Selector de tipo de artículo -->
            <div class="tipo-articulo">
                <button type="button" class="tipo-articulo-btn active" data-tipo="producto">
                    Producto Inventariado
                </button>
                <button type="button" class="tipo-articulo-btn" data-tipo="reparacion">
                    Servicio/Reparación
                </button>
            </div>

            <!-- Campos para Producto Inventariado -->
            <div id="campos-producto" class="campo-dinamico">
                <label>Producto</label>
                <select id="selectProducto">
                    <option value="" disabled selected>Seleccionar Producto</option>
                </select>
                <small class="error-msg"></small>
            </div>

            <!-- Campos para Servicio/Reparación -->
            <div id="campos-reparacion" class="campo-dinamico campo-oculto">
                <label>Producto/Servicio</label>
                <input type="text" id="inputProductoReparacion" placeholder="Escriba aquí" autocomplete="off">
                <small class="error-msg"></small>
            </div>

            <!-- Campos comunes -->
            <label>Cantidad</label>
            <input type="number" id="inputCantidad" placeholder="Escriba aquí" autocomplete="off" min="1">
            <small class="error-msg"></small>

            <label>Precio por unidad</label>
            <input type="number" id="inputPrecio" placeholder="0.00" autocomplete="off" step="0.01" min="0">
            <small class="error-msg"></small>

            <div class="botones-accion">
                <button id="btnAgregar" class="btn-registrar">Agregar a Venta</button>
                <button id="btnActualizar" class="btn-actualizar" style="display:none;">Actualizar Artículo</button>
                <button id="btnCancelar" class="btn-cancelar-edicion" style="display:none;">Cancelar</button>
            </div>

            <hr>

            <a href="clientes.html"><label>Cliente</label></a>
            <select id="selectCliente">
                <option value="" selected>Consumidor Final</option>
            </select>
            <small class="error-msg"></small>

            <label>Fecha de venta</label>
            <input type="date" id="inputFecha" autocomplete="off" disabled>

        </section>

        <!-- Tabla -->
        <section class="tabla">

            <div class="buscador">
                <button id="listar_ventas"><img src="imgs/listar_ventas.png" alt="Listar ventas"></button>
                <button id="btnRegistrarVenta" class="btn-registro">Registrar Venta</button>
            </div>
            <div class="tabla-contenedor">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Tipo</th>
                            <th>Nombre Producto</th>
                            <th>Cantidad</th>
                            <th>Precio Unitario</th>
                            <th>SubTotal</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tbodyVentas">
                        <!-- Los artículos se agregarán aquí dinámicamente -->
                    </tbody>
                </table>
            </div>
            <div class="total-venta">
                <h3>Total de la venta: </h3>
                <h3 id="totalVenta">$0.00</h3>
            </div>

        </section>

        <!-- Modal de Confirmación -->
        <div id="modalConfirmar" class="modal">
            <div class="modal-content warning">
                <span class="close" id="btnCerrarConfirmar">&times;</span>
                <h1>⚠</h1>
                <p>¿Seguro que deseas eliminar este artículo de la venta?</p>
                <div class="modal-actions">
                    <button id="btnConfirmarEliminar" class="btn-confirmar">Sí, eliminar</button>
                    <button id="btnCancelarEliminar" class="btn-cancelar">Cancelar</button>
                </div>
            </div>
        </div>

        <!-- Modal de mensajes -->
        <div id="modalMensaje" class="modal">
            <div class="modal-mensaje-contenido">
                <div class="modal-mensaje-icono" id="modalIcono"></div>
                <div class="modal-mensaje-texto">
                    <h2 id="modalTitulo"></h2>
                    <p id="modalTexto"></p>
                </div>
                <button id="cerrarMensaje" class="btn-cerrar">X</button>
            </div>
        </div>

    </main>

    <script src="js/jsVenta.js"></script>
</body>

</html>
