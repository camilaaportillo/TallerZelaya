<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="imgs/favicon.png" type="image/png">
    <title>Ventas</title>
    <link rel="stylesheet" href="css/ventaStyle.css">
    <!-- Choices (CSS y JS) - CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>
    <style>
        body {
            visibility: hidden;
        }

        /* oculta el body si no se ha iniciado sesion */
    </style>
    <script src="js/sesion.js"></script>

</head>

<body>

    <!-- Encabezado -->
    <header>
        <button class="logo-btn" onclick="irInicio()">
            <img src="imgs/bicicleta.png" alt="Logo bicicleta">
            <span class="hover-text">Inicio</span>
        </button>
        <h1>Taller de bicicletas Zelaya</h1>
        <div class="usuario">
            <div class="info-usuario">
                <span id="nombreUsuario" class="nombre-usuario">Usuario</span>
                <span id="rolUsuario" class="rol-usuario"></span>
            </div>
            <button class="user-btn" onclick="toggleMenu()">
                <img src="imgs/logo_user.png" alt="Usuario">
            </button>
            <div id="menuUsuario" class="menu-usuario">
                <a href="#" onclick="cerrarSesion()">Cerrar sesión</a>
            </div>
        </div>
    </header>

    <main>

        <!-- Formulario 1 (Productos) -->
        <section class="formulario">
            <button class="btn-registrar">Agregar a Venta</button>
            <button class="btn-actualizar" style="display:none;">Editar Producto</button>
            <button class="btn-cancelar-edicion" style="display:none;">Cancelar edición</button>

            <label>Producto</label>
            <select id="selectProducto">
                <option value="" disabled selected>Seleccionar Producto</option>
            </select>
            <small class="error-msg"></small>

            <label>Cantidad a vender</label>
            <input type="number" id="inputCantidadProducto" placeholder="Escriba aquí" autocomplete="off">
            <small class="error-msg"></small>

            <label>Precio por unidad</label>
            <input type="number" id="inputPrecioProducto" placeholder="0.00" autocomplete="off">
            <small class="error-msg"></small>

            <hr>
            <a href="clientes.html"><label>Cliente</label></a>
            <select id="selectCliente">
                <option value="" selected>Consumidor Final</option>
            </select>
            <small class="error-msg"></small>

            <label>Fecha de venta</label>
            <input type="date" id="inputFecha" autocomplete="off">

            <br>
            <hr>
            <button id="btnCambiarReparacion" type="button">Cambiar a Reparacion</button>
        </section>

        <!-- Formulario 2 (Reparaciones) -->
        <section class="formulario2" style="display:none;">
            <button class="btn-registrar">Agregar a Venta</button>
            <button class="btn-actualizar" style="display:none;">Editar Servicio</button>
            <button class="btn-cancelar-edicion" style="display:none;">Cancelar edición</button>

            <label>Producto/Servicio</label>
            <input type="text" id="inputProductoReparacion" placeholder="Escriba aquí" autocomplete="off">
            <small class="error-msg"></small>

            <label>Cantidad</label>
            <input type="number" id="inputCantidadReparacion" placeholder="Escriba aquí" autocomplete="off">
            <small class="error-msg"></small>

            <label>Precio por unidad</label>
            <input type="number" id="inputPrecioReparacion" placeholder="0.00" autocomplete="off">
            <small class="error-msg"></small>

            <hr>
            <!-- MANTENER EL MISMO CLIENTE Y FECHA -->
            <a href="clientes.html"><label>Cliente</label></a>
            <select id="selectCliente">
                <option value="" selected>Consumidor Final</option>
            </select>
            <small class="error-msg"></small>

            <label>Fecha de venta</label>
            <input type="date" id="inputFecha" autocomplete="off">

            <br>
            <hr>
            <button id="btnCambiarProductos" type="button">Cambiar a Productos</button>
        </section>

        <!-- Tabla -->
        <section class="tabla">

            <div class="buscador">
                <button id="listar_ventas"><img src="imgs/listar_ventas.png" alt="Listar ventas"></button>
                <button id="btn-registro" class="btn-registro">Registrar Venta</button>
            </div>
            <div class="tabla-contenedor">
                <table>
                    <thead>
                        <tr>
                            <th>Numero de item</th>
                            <th>Nombre Producto</th>
                            <th>Cantidad vendida</th>
                            <th>Precio Unitario</th>
                            <th>SubTotal</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>

                    </tbody>
                </table>
            </div>
            <div style="display: flex; justify-content: right; margin-top: 10px;">
                <h3> Total de la venta: </h3>
                <h3 id="totalVenta" style="margin-left: 10px;"> $0.00 </h3>
            </div>

        </section>


        <!-- Modal de acciones -->
        <div id="modalAcciones" class="modal">
            <div class="modal-contenido">
                <h2>Acciones</h2>
                <div class="modal-botones">
                    <button id="btnEditarModal" class="btn-accion btn-azul">Editar</button>
                    <button id="btnEliminarModal" class="btn-accion btn-rojo">Eliminar</button>
                </div>
                <button id="cerrarModal" class="btn-cerrar">X</button>
            </div>
        </div>

        <!-- Modal de mensajes -->
        <div id="modalMensaje" class="modal">
            <div class="modal-mensaje-contenido">
                <div class="modal-mensaje-icono" id="modalIcono"></div>
                <div class="modal-mensaje-texto">
                    <h2 id="modalTitulo"></h2>
                    <p id="modalTexto"></p>
                </div>
                <button id="cerrarMensaje" class="btn-cerrar">X</button>
            </div>
        </div>

        <!-- Modal de Confirmación -->
        <div id="modalConfirmar" class="modal">
            <div class="modal-content warning">
                <span class="close" id="btnCerrarConfirmar">&times;</span>
                <h1>⚠</h1>
                <p>¿Seguro que deseas eliminar este registro?</p>
                <div class="modal-actions">
                    <button id="btnConfirmarEliminar" class="btn-confirmar">Sí, eliminar</button>
                    <button id="btnCancelarEliminar" class="btn-cancelar">Cancelar</button>
                </div>
            </div>
        </div>

    </main>

    <script src="js/jsVenta.js"></script>
</body>

</html>
