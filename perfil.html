<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de Usuario</title>
    <link rel="stylesheet" href="css/perfilStyle.css">
    <style>
        body { visibility: hidden; } /* Ocultar body hasta validar sesión */
    </style>
</head>

<body>
    <!-- Encabezado -->
    <header>
        <button class="logo-btn" onclick="irInicio()">
            <img src="imgs/bicicleta.png" alt="Logo bicicleta">
        </button>
        <h1>Taller de bicicletas Zelaya</h1>
        <div class="usuario">
            <div class="info-usuario">
                <span id="nombreUsuario" class="nombre-usuario">Usuario</span>
                <span id="rolUsuario" class="rol-usuario"></span>
            </div>
            <button class="user-btn" onclick="toggleMenu()">
                <img src="imgs/logo_user.png" alt="Usuario">
            </button>
            <div id="menuUsuario" class="menu-usuario">
                <a href="#" onclick="cerrarSesion()">Cerrar sesión</a>
            </div>
        </div>
    </header>

    <!-- Contenido principal -->
    <main>
        <div class="perfil-contenedor">
            <!-- Foto de perfil -->
            <div class="perfil-foto">
                <img src="imgs/logo_user.png" alt="Foto del usuario">
            </div>

            <!-- Datos del usuario -->
            <div class="perfil-datos">
                <h2 id="nombrePerfil">Juan Pérez</h2>
                
                <p><strong>Correo:</strong> <span id="correoPerfil"></span></p>
                <p><strong>Usuario:</strong> <span id="usuarioPerfil"></span></p>
              
                

                <!-- Acciones -->
                <div class="perfil-acciones">
                    <button onclick="editarPerfil()">Editar Usuario</button>
                    <button onclick="cambiarContrasena()">Cambiar Contraseña</button>
                </div>
            </div>
        </div>
    </main>

        <!-- Modal Cambiar Contraseña -->
<!-- Modal Cambiar Contraseña -->

<!-- Modal Cambiar Contraseña -->
<div id="modalContrasena" class="modal" style="display:none;">
    <div class="modal-contenido">
        <h2>Cambiar Contraseña</h2>
        <form id="formContrasena">
            <label for="actualContrasena">Contraseña Actual:</label>
            <input type="password" id="actualContrasena" name="actualContrasena" placeholder="Ingresa tu contraseña actual" required>

            <label for="nuevaContrasena">Nueva Contraseña:</label>
            <input type="password" id="nuevaContrasena" name="nuevaContrasena"
             placeholder="Ingresa tu nueva contraseña" required>

            <label for="confirmarContrasena">Confirmar Nueva Contraseña:</label>
            <input type="password" id="confirmarContrasena" name="confirmarContrasena" placeholder="Repite tu nueva contraseña" required>

            <div class="modal-botones">
                <button type="button" id="btnGuardarContrasena">Guardar</button>
                <button type="button" onclick="cerrarModalContrasena()">Cancelar</button>
            </div>
        </form>
        <button class="btn-cerrar" onclick="cerrarModalContrasena()">X</button>
    </div>
</div>
<!-- Modal Editar Usuario -->
<div id="modalEditarUsuario" class="modal" style="display:none;">
    <div class="modal-contenido">
        <h2>Editar Usuario</h2>
        <form id="formEditarUsuario">
            <label for="nuevoUsuario">Nuevo Usuario:</label>
            <input type="text" id="nuevoUsuario" name="nuevoUsuario" autocomplete="off" placeholder="Escribe el nuevo usuario" required>
           <p style="font-size: 0.9em; color: #c00;">
    ⚠️ Si cambias tu alias, el sistema cerrará la sesión automáticamente.
</p>

            <div class="modal-botones">
                <button type="button" id="btnGuardarUsuario">Guardar</button>
                <button type="button" id="btnCancelarUsuario">Cancelar</button>
            </div>
        </form>
        <button id="cerrarModal" class="btn-cerrar">X</button>
    </div>
</div>

 <!-- ===========================
     Modal de Mensajes Global
=========================== -->
<div id="modalMensaje" class="modal-mensaje">
  <div class="modal-mensaje-contenido">
    <span id="modalIcono" class="modal-mensaje-icono"></span>
    <h3 id="modalTitulo"></h3>
    <p id="modalTexto"></p>
    <button id="cerrarMensaje" class="btn-cerrar">Cerrar</button>
  </div>
</div>


<script>
    // Mostrar/Ocultar menú de usuario
    function toggleMenu() {
        document.getElementById("menuUsuario").classList.toggle("mostrar");
    }

  
    function editarPerfil() {
        document.getElementById("modalEditarUsuario").style.display = "flex";
        // Rellenar campo con el usuario actual
        document.getElementById("nuevoUsuario").value = document.getElementById("usuarioPerfil").textContent;
        
    }

    function cerrarModalEditar() {
        document.getElementById("modalEditarUsuario").style.display = "none";
    }

    function cambiarContrasena() {
        document.getElementById("modalContrasena").style.display = "flex";
    }

    function cerrarModalContrasena() {
        document.getElementById("modalContrasena").style.display = "none";
        // Opcional: limpiar campos al cerrar
        document.getElementById("formContrasena").reset();
    }
</script>


    <script src="js/sesion.js"></script>
    <script src="js/jsPerfil.js"></script>
</body>
</html>
