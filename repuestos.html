<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="imgs/favicon.png" type="image/png">
    <title>Repuestos</title>
    <link rel="stylesheet" href="css/repuestoStyle.css">
</head>

<body>

    <!-- Encabezado -->
    <header>
        <button class="logo-btn" onclick="irInicio()">
            <img src="imgs/bicicleta.png" alt="Logo bicicleta">
        </button>
        <h1>Repuestos</h1>
        <div class="usuario">
            <span class="nombre-usuario">Usuario</span>
            <button class="user-btn" onclick="toggleMenu()">
                <img src="imgs/logo_user.png" alt="Usuario">
            </button>
            <div id="menuUsuario" class="menu-usuario">
                <a href="#">Cerrar sesión</a>
            </div>
        </div>
    </header>

    <main>

        <!-- Formulario -->
        <section class="formulario">
            <button class="btn-registrar">Agregar Producto</button>
            <button class="btn-actualizar" style="display:none;">Editar Producto</button>
            <button id="btnCancelarEdicion" class="btn-cancelar-edicion" style="display:none;">Cancelar edición</button>


            <label>Nombre del Producto</label>
            <input type="text" id="inputNombreProductos" placeholder="Escriba aquí" autocomplete="off">
            <small id="errorNombre" class="error-msg"></small>

            <label>Descripcion del producto</label>
            <input type="text" id="inputDescripcionProducto" placeholder="Escriba aquí" autocomplete="off">
            <small id="errorTelefono" class="error-msg"></small>

            <label>Stock Mínimo</label>
            <input type="number" id="inputStockMinimo" placeholder="Escriba aquí" autocomplete="off">
            <small id="errorCorreo" class="error-msg"></small>

            <label>Marca</label>
            <select id="selectMarca">
                <option value="" disabled selected>Seleccionar Marca</option>
            </select>

            <label>Medida</label>
            <select id="selectMedida">
                <option value="" disabled selected>Seleccionar Medida</option>
            </select>

        </section>

        <!-- Tabla -->
        <section class="tabla">

            <div class="buscador">
                <button id="btn-volver" class="btn-volver" style="display:none;">Volver</button>
                <p></p>

                <!-- Grupo de búsqueda -->
                <div class="buscador-derecha">
                    <input type="text" id="inputBuscar" placeholder="Buscar...">
                    <button id="btnLimpiar" style="display:none;">❌</button>
                </div>
            </div>
            <div class="tabla-contenedor">
                <table>
                    <thead>
                        <tr>
                            <th>Código Producto</th>
                            <th>Nombre Producto</th>
                            <th>Descripcion Producto</th>
                            <th>Stock Mínimo</th>
                            <th>Marca Producto</th>
                            <th>Medida Producto</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>

                    </tbody>
                </table>
            </div>
            <div style="display: flex; justify-content: right; margin-top: 10px;">
                <p> </p>
            </div>

        </section>


        <!-- Modal de acciones -->
        <div id="modalAcciones" class="modal">
            <div class="modal-contenido">
                <h2>Acciones</h2>
                <div class="modal-botones">
                    <button id="btnEditarModal" class="btn-accion btn-azul">Editar</button>
                    <button id="btnEliminarModal" class="btn-accion btn-rojo">Eliminar</button>

                </div>
                <button id="cerrarModal" class="btn-cerrar">X</button>
            </div>
        </div>

        <!-- Modal de mensajes -->
        <div id="modalMensaje" class="modal">
            <div class="modal-mensaje-contenido">
                <div class="modal-mensaje-icono" id="modalIcono"></div>
                <div class="modal-mensaje-texto">
                    <h2 id="modalTitulo"></h2>
                    <p id="modalTexto"></p>
                </div>
                <button id="cerrarMensaje" class="btn-cerrar">X</button>
            </div>
        </div>

        <!-- Modal de Confirmación -->
        <div id="modalConfirmar" class="modal">
            <div class="modal-content warning">
                <span class="close" onclick="cerrarModalConfirmar()">&times;</span>
                <h1>⚠</h1>
                <p>¿Seguro que deseas eliminar este registro?</p>
                <div class="modal-actions">
                    <button id="btnConfirmarEliminar" class="btn-confirmar">Sí, eliminar</button>
                    <button onclick="cerrarModalConfirmar()" class="btn-cancelar">Cancelar</button>
                </div>
            </div>
        </div>
    </main>
</body>

<script src="js/jsRepuesto.js"></script>

</html>
