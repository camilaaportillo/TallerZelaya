<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="imgs/favicon.png" type="image/png">
    <title>Empresas</title>
    <link rel="stylesheet" href="css/empresaStyle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
     <style>
        body { visibility: hidden; } /* oculta el body si no se ha iniciado sesion */
    </style>
    <script src="js/sesion.js"></script> 
</head>

<body>

   <!-- Encabezado -->
    <header>
    <button class="logo-btn" onclick="irInicio()">
        <img src="imgs/bicicleta.png" alt="Logo bicicleta">
        <span class="hover-text">Inicio</span>
    </button>
    <h1>Taller de bicicletas Zelaya</h1>

    <div class="header-derecha">
        <button class="help-btn" onclick="mostrarAyuda('empresas')" title="Ayuda del Sistema">
            <i class="fas fa-question-circle"></i>
            <span class="hover-text">Ayuda</span>
        </button>
        <div class="usuario">
            <div class="info-usuario">
                <span id="nombreUsuario" class="nombre-usuario">Usuario</span>
                <span id="rolUsuario" class="rol-usuario"></span>
            </div>
            <button class="user-btn" onclick="toggleMenu()">
                <img src="imgs/logo_user.png" alt="Usuario">
            </button>
            <div id="menuUsuario" class="menu-usuario">
                <a href="#" onclick="irPerfil()">Perfil</a>
                <a href="#" onclick="cerrarSesion()">Cerrar sesión</a>
            </div>
        </div>
    </div>
</header>


    <main>

        <!-- Formulario -->
        <section class="formulario">
            <button class="btn-registrar">Agregar empresa</button>
            <button class="btn-actualizar" style="display:none;">Editar empresa</button>
            <button id="btnCancelarEdicion" class="btn-cancelar-edicion" style="display:none;">Cancelar edición</button>

            <label>Nombre de Empresa</label>
            <input type="text" id="inputNombre" placeholder="Escriba aquí" autocomplete="off">
            <small id="errorNombre" class="error-msg"></small>

            <label>Correo de Empresa</label>
            <input type="email" id="inputCorreo" placeholder="Escriba aquí" autocomplete="off">
            <small id="errorCorreo" class="error-msg"></small>

            <label>Teléfono de Empresa</label>
            <input type="text" id="inputTelefono" placeholder="Escriba aquí" autocomplete="off">
            <small id="errorTelefono" class="error-msg"></small>


            <p style="font-size: 15px; color: rgb(0, 0, 0); margin-top: -10px; margin-bottom: 10px;">Presione "Enter"
                para cambiar de campo</p>
            <br>

            <br>


        </section>

        <!-- Tabla -->
        <section class="tabla">

            <div class="buscador">
                <button id="btn-volver" class="btn-volver" style="display:none;">Volver</button>
                <p></p>

                <!-- Grupo de búsqueda -->
                <div class="buscador-derecha">
                    <input type="text" id="inputBuscar" placeholder="Buscar...">
                    <button id="btnLimpiar" style="display:none;">❌</button>
                </div>
            </div>

            <div class="tabla-contenedor">
                <table>
                    <thead>
                        <tr>
                            <th>Nombre Empresa</th>
                            <th>Correo Empresa</th>
                            <th>Telefono Empresa</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody>

                    </tbody>
                </table>
            </div>
            <div style="display: flex; justify-content: right; margin-top: 10px;">
                <p> </p>
                <button id="btn-habilitar-registro" class="btn-habilitar-registro">Habilitar Empresa</button>
            </div>

        </section>


        <!-- Modal de acciones -->
        <div id="modalAcciones" class="modal">
            <div class="modal-contenido">
                <h2>Acciones</h2>
                <div class="modal-botones">
                    <button id="btnEditarModal" class="btn-accion btn-azul">Editar</button>
                    <button id="btnEliminarModal" class="btn-accion btn-rojo">Deshabilitar</button>

                </div>
                <button id="cerrarModal" class="btn-cerrar">X</button>
            </div>
        </div>

        <!-- Modal de mensajes -->
        <div id="modalMensaje" class="modal">
            <div class="modal-mensaje-contenido">
                <div class="modal-mensaje-icono" id="modalIcono"></div>
                <div class="modal-mensaje-texto">
                    <h2 id="modalTitulo"></h2>
                    <p id="modalTexto"></p>
                </div>
                <button id="cerrarMensaje" class="btn-cerrar">X</button>
            </div>
        </div>

        <!-- Modal de Confirmación -->
        <div id="modalConfirmar" class="modal">
            <div class="modal-content warning">
                <span class="close" onclick="cerrarModalConfirmar()">&times;</span>
                <h1>⚠</h1>
                <p>¿Seguro que deseas deshabilitar este registro?</p>
                <div class="modal-actions">
                    <button id="btnConfirmarEliminar" class="btn-confirmar">Sí, deshabilitar</button>
                    <button onclick="cerrarModalConfirmar()" class="btn-cancelar">Cancelar</button>
                </div>
            </div>
        </div>
    </main>
    <!-- Modal de Ayuda PDF -->
<div id="modalAyuda" class="modal-ayuda">
    <div class="modal-ayuda-contenido">
        <div class="modal-header">
            <h2><i class="fas fa-question-circle"></i> Ayuda del Sistema</h2>
            <div class="modal-controls">
                <button class="btn-descargar" onclick="descargarPDFActual()" title="Descargar Manual">
                    <i class="fas fa-download"></i> Descargar
                </button>
                <button class="btn-cerrar-ayuda" onclick="ocultarAyuda()" title="Cerrar Ayuda">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </div>
        <div class="modal-body">
            <div class="pdf-container">
                <object id="pdfObject" data="" type="application/pdf" width="100%" height="100%">
                    <div class="pdf-fallback">
                        <p>No se puede mostrar el PDF. <a href="#" onclick="descargarPDFActual()">Descarga el manual aquí</a>.</p>
                    </div>
                </object>
            </div>
        </div>
    </div>
</div>
<script>
// Cerrar modal con ESC y clic fuera
document.addEventListener('keydown', function(event) {
    if (event.key === 'Escape') ocultarAyuda();
});

document.getElementById('modalAyuda').addEventListener('click', function(event) {
    if (event.target === this) ocultarAyuda();
});
</script>
<!-- Incluir el sistema de ayuda -->
<script src="js/ayuda-sistema.js"></script>
    <script src="js/jsEmpresa.js"></script>
    
</body>

</html>
