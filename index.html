<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="imgs/favicon.png" type="image/png">
    <title>Sistema del Taller Zelaya</title>
    <link rel="stylesheet" href="css/styles.css">

    <script src="js/sesion.js"></script>
</head>

<body>

    <!-- Encabezado -->
    <header>
        <button class="logo-btn" onclick="irInicio()">
            <img src="imgs/bicicleta.png" alt="Logo bicicleta">
        </button>
        <h1>Taller de bicicletas Zelaya</h1>
        <div class="usuario">
            <div class="info-usuario">
                <span id="nombreUsuario" class="nombre-usuario" onclick="irPerfil()"
                    style="cursor: pointer;">Usuario</span>

                <span id="rolUsuario" class="rol-usuario"></span>
            </div>
            <button class="user-btn" onclick="toggleMenu()">
                <img src="imgs/logo_user.png" alt="Usuario">
            </button>
            <div id="menuUsuario" class="menu-usuario">
                <a href="#" onclick="cerrarSesion()">Cerrar sesión</a>
            </div>
        </div>
    </header>

    <!-- Contenido principal -->
    <main>
        <div class="grid-menu">
            <a class="item admin-only" href="usuario.html">
                <img src="imgs/usuarios.png" alt="Usuarios">
                <p>Usuarios</p>
            </a>
            <a class="item admin-only" href="empresa.html">
                <img src="imgs/empresas.png" alt="Empresas">
                <p>Empresas</p>
            </a>
            <a class="item admin-only" href="marcas.html">
                <img src="imgs/marcas.png" alt="Marcas">
                <p>Marcas</p>
            </a>
            <a class="item" href="clientes.html">
                <img src="imgs/clientes.png" alt="Clientes">
                <p>Clientes</p>
            </a>
            <a class="item" href="medidas.html">
                <img src="imgs/medidas.png" alt="Medidas">
                <p>Medidas</p>
            </a>
            <a class="item" href="inventario.html">
                <img src="imgs/inventario.png" alt="Inventario">
                <p>Inventario</p>
            </a>
            <a class="item admin-only" href="proveedor.html">
                <img src="imgs/proveedores.png" alt="Proveedores">
                <p>Proveedores</p>
            </a>
            <a class="item" href="repuestos.html">
                <img src="imgs/repuestos.png" alt="Repuestos">
                <p>Repuestos</p>
            </a>
            <a class="item admin-only" href="compra.html">
                <img src="imgs/Compra.png" alt="Compras">
                <p>Compras</p>
            </a>
            <a class="item" href="compra.html">
                <img src="imgs/Compra.png" alt="Ventas">
                <p>Ventas</p>
            </a>
            
        </div>
    </main>

    <script src="js/script.js"></script>
    
    <script>
        function irPerfil() {
            window.location.href = "perfil.html";
        }
    </script>

</body>

</html>
