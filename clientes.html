<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="imgs/favicon.png" type="image/png">
    <title>Clientes</title>
    <link rel="stylesheet" href="css/clientes.css"> <!-- mismo estilo -->
     <style>
        body { visibility: hidden; } /* oculta el body si no se ha iniciado sesion */
    </style>
    <script src="js/sesion.js"></script> 
</head>

<body>

    <!-- Encabezado -->
    <header>
        <button class="logo-btn" onclick="irInicio()">
            <img src="imgs/bicicleta.png" alt="Logo bicicleta">
            <span class="hover-text">Inicio</span>
        </button>
        <h1>Taller de bicicletas Zelaya</h1>
        <div class="usuario">
            <div class="info-usuario">
                <span id="nombreUsuario" class="nombre-usuario">Usuario</span>
                <span id="rolUsuario" class="rol-usuario"></span>
            </div>
            <button class="user-btn" onclick="toggleMenu()">
                <img src="imgs/logo_user.png" alt="Usuario">
            </button>
            <div id="menuUsuario" class="menu-usuario">
                <a href="#" onclick="cerrarSesion()">Cerrar sesión</a>
            </div>
        </div>
    </header>
    <main>

        <!-- Formulario -->
        <section class="formulario">
            <button class="btn-registrar">Agregar cliente</button>
            <button class="btn-actualizar" style="display:none;">Editar cliente</button>
            <button id="btnCancelarEdicion" class="btn-cancelar" style="display:none;"> Cancelar edición </button>

            <label>Nombre del Cliente</label>
            <input type="text" id="inputNombre" autocomplete="off" placeholder="Escriba aquí">

            <label>Correo</label>
            <input type="email" id="inputCorreo" autocomplete="off" placeholder="ejemplo@correo.com">

            <label>Teléfono</label>
            <input type="text" id="inputTelefono" autocomplete="off" placeholder="0000-0000">

        </section>

        <!-- Tabla de clientes -->
        <section class="tabla">

            <div class="buscador">
                <input type="text" id="inputBuscar" placeholder="Buscar...">
                <button id="btnLimpiar" style="display:none;">❌</button>
            </div>

            <div class="tabla-contenedor">
                <table>
                    <thead>
                        <tr>
                            <th>Nombre Cliente</th>
                            <th>Correo</th>
                            <th>Teléfono</th>
                          
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody id="tbodyClientes">
                        <!-- Se rellena con JS -->
                    </tbody>
                </table>
            </div>

            <!-- Botón alineado a la derecha debajo de la tabla -->
            <div class="contenedor-boton-habilitar">
                <button id="btn-habilitar-registro" class="btn-habilitar-registro" 
                        onclick="window.location.href='clientesInactivos.html'">
                    Habilitar clientes
                </button>
            </div>

        </section>

        <!-- Modal de acciones -->
        <div id="modalAcciones" class="modal">
            <div class="modal-contenido">
                <h2>Acciones</h2>
                <div class="modal-botones">
                    <button id="btnEditarModal" class="btn-accion btn-azul">Editar</button>
                    <button id="btnEliminarModal" class="btn-accion btn-rojo">Deshabilitar</button>
                </div>
                <button id="cerrarModal" class="btn-cerrar">X</button>
            </div>
        </div>

        <!-- Modal de mensajes -->
        <div id="modalMensaje" class="modal">
            <div class="modal-mensaje-contenido">
                <div class="modal-mensaje-icono" id="modalIcono"></div>
                <div class="modal-mensaje-texto">
                    <h2 id="modalTitulo"></h2>
                    <p id="modalTexto"></p>
                </div>
                <button id="cerrarMensaje" class="btn-cerrar">X</button>
            </div>
        </div>

        <!-- Modal de Confirmación -->
        <div id="modalConfirmar" class="modal">
            <div class="modal-content warning">
                <span class="close" onclick="cerrarModalConfirmar()">&times;</span>
                <p>¿Seguro que deseas deshabilitar este registro?</p>
                <div class="modal-actions">
                    <button id="btnConfirmarEliminar" class="btn-confirmar">Sí, deshabilitar</button>
                    <button onclick="cerrarModalConfirmar()" class="btn-cancelar">Cancelar</button>
                </div>
            </div>
        </div>
    </main>
    <script src="js/jsClientes.js"></script>


</body>

</html>
