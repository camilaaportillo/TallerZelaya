<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <title>Detalle de Factura</title>
  <link rel="icon" href="imgs/favicon.png" type="image/png">
  <link rel="stylesheet" href="css/detalle_compra.css">
</head>

<body>
  <button class="logo-btn" onclick="window.location.href='listar_compras.html'"">
    ⬅
  </button>
  <main>
    <div class="factura" id="factura">
      <header>

        <h1 id="empresaNombre">Empresa</h1>
        <small id="empresaContacto">correo • teléfono</small>
        <div class="info">
          <strong>Factura</strong> <span id="facturaId">#--</span><br>
          <small id="facturaFecha">--</small>
        </div>
      </header>

      <section>
        <div>
          <h3>Proveedor</h3>
          <p id="proveedorNombre"></p>
          <small id="proveedorContacto"></small>
        </div>
        <div>
          <h3>Usuario</h3>
          <p id="usuarioNombre"></p>
          <small id="usuarioLogin"></small>
        </div>
      </section>

      <table id="tablaProductos">
        <thead>
          <tr>
            <th>#</th>
            <th>Producto</th>
            <th>Cantidad</th>
            <th>Precio unitario</th>
            <th>Subtotal</th>
          </tr>
        </thead>
        <tbody></tbody>
        <tfoot>
          <tr>
            <td colspan="4" style="text-align:right"><strong>Total</strong></td>
            <td id="totalFactura">0.00</td>
          </tr>
        </tfoot>
      </table>

      <div class="acciones">
        <button id="verImagen">Ver Factura</button>
        <a id="descargarImagen" style="display:none;" class="btn">Descargar Factura</a>
        <button onclick="window.print()">Imprimir Factura</button>
      </div>

      <div id="contenedorImagen" style="display:none; text-align:center; margin-top:20px;">
        <img id="facturaImg" style="max-width:100%; border:1px solid #ddd;">
      </div>
    </div>


    <!-- Modal de mensajes -->
    <div id="modalMensaje" class="modal">
      <div class="modal-mensaje-contenido">
        <div class="modal-mensaje-icono" id="modalIcono"></div>
        <div class="modal-mensaje-texto">
          <h2 id="modalTitulo"></h2>
          <p id="modalTexto"></p>
        </div>
        <button id="cerrarMensaje" class="btn-cerrar">X</button>
      </div>
    </div>
  </main>
  <script src="js/jsDetalleCompra.js"></script>
</body>

</html>
