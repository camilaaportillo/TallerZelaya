<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="imgs/favicon.png" type="image/png">
    <title>Compras</title>
    <link rel="stylesheet" href="css/compraStyle.css">
    <!-- Choices (CSS y JS) - CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>
    <style>
        body {
            visibility: hidden;
        }

        /* oculta el body si no se ha iniciado sesion */
    </style>
    <script src="js/sesion.js"></script>

</head>

<body>

    <!-- Encabezado -->
    <header>
    <button class="logo-btn" onclick="irInicio()">
        <img src="imgs/bicicleta.png" alt="Logo bicicleta">
        <span class="hover-text">Inicio</span>
    </button>
    <h1>Taller de bicicletas Zelaya</h1>

    <div class="header-derecha">
        <button class="help-btn" onclick="mostrarAyuda('compras')" title="Ayuda del Sistema">
            <i class="fas fa-question-circle"></i>
            <span class="hover-text">Ayuda</span>
        </button>
        <div class="usuario">
            <div class="info-usuario">
                <span id="nombreUsuario" class="nombre-usuario">Usuario</span>
                <span id="rolUsuario" class="rol-usuario"></span>
            </div>
            <button class="user-btn" onclick="toggleMenu()">
                <img src="imgs/logo_user.png" alt="Usuario">
            </button>
            <div id="menuUsuario" class="menu-usuario">
                <a href="#" onclick="irPerfil()">Perfil</a>
                <a href="#" onclick="cerrarSesion()">Cerrar sesión</a>
            </div>
        </div>
    </div>
</header>


    <main>

        <!-- Formulario -->
        <section class="formulario">
            <button class="btn-registrar">Agregar Producto</button>
            <button class="btn-actualizar" style="display:none;">Editar Producto</button>
            <button id="btnCancelarEdicion" class="btn-cancelar-edicion" style="display:none;">Cancelar edición</button>

            <label>Producto</label>
            <select id="selectProducto">
                <option value="" disabled selected>Seleccionar Producto</option>
            </select>
            <small id="errorProducto" class="error-msg"></small>

            <label>Cantidad Comprada</label>
            <input type="number" id="inputCantidad" placeholder="Escriba aquí" autocomplete="off">
            <small id="errorCantidad" class="error-msg"></small>

            <label>Precio por unidad</label>
            <input type="number" id="inputPrecio" placeholder="Escriba aquí" autocomplete="off">
            <small id="errorPrecio" class="error-msg"></small>

            <hr>

            <label>Proveedor</label>
            <select id="selectProveedor">
                <option value="" disabled selected>Seleccionar Proveedor</option>
            </select>
            <small id="errorProveedor" class="error-msg"></small>

            <label>Fecha de compra</label>
            <input type="date" id="fecha" placeholder="Escriba aquí" autocomplete="off">
            <small id="errorFecha" class="error-msg"></small>
        </section>

        <!-- Tabla -->
        <section class="tabla">

            <div class="buscador">
                <button id="listar_compras"><img src="imgs/listar_compra.png"></button>
                <!-- Botón que abre el modal -->
                <button id="subirFactura"><img src="imgs/subir_factura.png"></button>

                <button></button>
                <button id="btn-registro" class="btn-registro">Enviar</button>
            </div>
            <div class="tabla-contenedor">
                <table>
                    <thead>
                        <tr>
                            <th>Numero de item</th>
                            <th>Nombre Producto</th>
                            <th>Cantidad Comprada</th>
                            <th>Precio Unitario</th>
                            <th>SubTotal</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>

                    </tbody>
                </table>
            </div>
            <div style="display: flex; justify-content: right; margin-top: 10px;">
                <h3> Total de la compra: </h3>
                <h3 id="totalCompra" style="margin-left: 10px;"> $0.00 </h3>
            </div>

        </section>


        <!-- Modal de acciones -->
        <div id="modalAcciones" class="modal">
            <div class="modal-contenido">
                <h2>Acciones</h2>
                <div class="modal-botones">
                    <button id="btnEditarModal" class="btn-accion btn-azul">Editar</button>
                    <button id="btnEliminarModal" class="btn-accion btn-rojo">eliminar</button>

                </div>
                <button id="cerrarModal" class="btn-cerrar">X</button>
            </div>
        </div>

        <!-- Modal de mensajes -->
        <div id="modalMensaje" class="modal">
            <div class="modal-mensaje-contenido">
                <div class="modal-mensaje-icono" id="modalIcono"></div>
                <div class="modal-mensaje-texto">
                    <h2 id="modalTitulo"></h2>
                    <p id="modalTexto"></p>
                </div>
                <button id="cerrarMensaje" class="btn-cerrar">X</button>
            </div>
        </div>

        <!-- Modal de Confirmación -->
        <div id="modalConfirmar" class="modal">
            <div class="modal-content warning">
                <span class="close" onclick="cerrarModalConfirmar()">&times;</span>
                <h1>⚠</h1>
                <p>¿Seguro que deseas eliminar este registro?</p>
                <div class="modal-actions">
                    <button id="btnConfirmarEliminar" class="btn-confirmar">Sí, eliminar</button>
                    <button id="btnCancelarEliminar" class="btn-cancelar">Cancelar</button>
                </div>
            </div>
        </div>

        <!-- Modal para subir la imagen -->
        <div id="modalFactura" class="modal" style="display:none;">
            <div class="modal-contenido">
                <h2>Subir Factura</h2>
                <form id="formFactura" enctype="multipart/form-data">
                    <input type="file" id="fileFactura" name="factura" accept="image/*" hidden>
                    <button type="button" id="btnSeleccionarFactura">Seleccionar Imagen</button>
                    <br>
                    <br>
                    <div class="preview" id="previewFactura"></div>
                    <br>
                    <small class="error-msg">Click fuera para cerrar</small>
                </form>
            </div>
        </div>

    </main>
<!-- Modal de Ayuda PDF -->
<div id="modalAyuda" class="modal-ayuda">
    <div class="modal-ayuda-contenido">
        <div class="modal-header">
            <h2><i class="fas fa-question-circle"></i> Ayuda del Sistema</h2>
            <div class="modal-controls">
                <button class="btn-descargar" onclick="descargarPDFActual()" title="Descargar Manual">
                    <i class="fas fa-download"></i> Descargar
                </button>
                <button class="btn-cerrar-ayuda" onclick="ocultarAyuda()" title="Cerrar Ayuda">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </div>
        <div class="modal-body">
            <div class="pdf-container">
                <object id="pdfObject" data="" type="application/pdf" width="100%" height="100%">
                    <div class="pdf-fallback">
                        <p>No se puede mostrar el PDF. <a href="#" onclick="descargarPDFActual()">Descarga el manual aquí</a>.</p>
                    </div>
                </object>
            </div>
        </div>
    </div>
</div>
<script>
// Cerrar modal con ESC y clic fuera
document.addEventListener('keydown', function(event) {
    if (event.key === 'Escape') ocultarAyuda();
});

document.getElementById('modalAyuda').addEventListener('click', function(event) {
    if (event.target === this) ocultarAyuda();
});
</script>
<!-- Incluir el sistema de ayuda -->
<script src="js/ayuda-sistema.js"></script>
    <script src="js/jsCompra.js"></script>
</body>

</html>
